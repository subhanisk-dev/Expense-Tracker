{% extends 'base.html' %}
{% block title %}Server Error · SpendWise{% endblock %}
{% block content %}
<div class="empty-state py-5 text-center">
    <div class="display-5 fw-bold">500</div>
    <h1 class="h3 fw-bold mt-2">Something went wrong</h1>
    <p class="text-muted">SpendWise could not complete that request. Please try again.</p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
        <i class="bi bi-house me-1"></i>
        Back to dashboard
    </a>
</div>
{% endblock %}
