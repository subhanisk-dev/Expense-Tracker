{% extends 'base.html' %}
{% block title %}Login · SpendWise{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="auth-icon">
                <i class="bi bi-wallet2"></i>
            </div>
            <h1>Welcome back</h1>
            <p>Sign in to continue managing your money.</p>
        </div>
        <form method="POST" novalidate>
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    value="{{ request.form.get('email', '') }}"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>
            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                    <label for="password" class="form-label fw-semibold mb-1">Password</label>
                </div>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right me-1"></i>
                Login
            </button>
        </form>
        <div class="auth-divider">
            <span>New to SpendWise?</span>
        </div>
        <div class="text-center">
            <a href="{{ url_for('register') }}" class="fw-semibold">Create an account</a>
        </div>
    </div>
</div>
{% endblock %}
